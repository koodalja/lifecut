<!doctype html>
<html id="doc-root" lang="ko">
<head id="doc-head">
  <meta id="doc-charset" charset="utf-8">
  <meta id="viewport-meta" name="viewport" content="width=device-width, initial-scale=1">
  <meta id="theme-meta" name="theme-color" content="#f8f3ec">
  <title id="doc-title">인생네컷 - 나만의 사진 프레임</title>
  <link id="main-stylesheet" rel="stylesheet" href="style.css">
  <script id="camera-script" defer src="js/camera.js"></script>
  <script id="frame-script" defer src="js/frame.js"></script>
  <script id="filters-script" defer src="js/filters.js"></script>
  <script id="app-script" defer src="js/app.js"></script>
</head>
<body id="doc-body">
  <main id="app-shell" class="app-shell">
    <header id="page-header" class="page-header">
      <p id="page-eyebrow" class="eyebrow">오늘의 기록</p>
      <h1 id="page-title">인생네컷</h1>
      <p id="page-intro" class="intro">원하는 컷 수를 고르고 나만의 사진을 남겨 보세요.</p>
    </header>

    <section id="selection-screen" class="photo-card workflow-screen" aria-labelledby="selection-heading">
      <div id="selection-heading-row" class="card-heading">
        <div id="selection-title-group">
          <p id="selection-step" class="step-label">STEP 01</p>
          <h2 id="selection-heading">몇 컷으로 찍을까요?</h2>
        </div>
        <span id="selection-badge" class="step-badge">2컷 또는 4컷</span>
      </div>

      <div id="cut-options" class="cut-options">
        <button id="select-two-button" class="cut-option" type="button" data-cut-count="2" aria-pressed="false">
          <span id="two-cut-frame" class="mini-frame mini-frame-two" aria-hidden="true">
            <span id="two-cut-photo-one" class="mini-frame-photo"></span>
            <span id="two-cut-photo-two" class="mini-frame-photo"></span>
          </span>
          <span id="two-cut-label" class="cut-option-label">2컷</span>
          <span id="two-cut-description" class="cut-option-description">가볍게 두 장</span>
        </button>
        <button id="select-four-button" class="cut-option" type="button" data-cut-count="4" aria-pressed="false">
          <span id="four-cut-frame" class="mini-frame mini-frame-four" aria-hidden="true">
            <span id="four-cut-photo-one" class="mini-frame-photo"></span>
            <span id="four-cut-photo-two" class="mini-frame-photo"></span>
            <span id="four-cut-photo-three" class="mini-frame-photo"></span>
            <span id="four-cut-photo-four" class="mini-frame-photo"></span>
          </span>
          <span id="four-cut-label" class="cut-option-label">4컷</span>
          <span id="four-cut-description" class="cut-option-description">네 장으로 완성</span>
        </button>
      </div>

      <p id="selection-status" class="status-message" role="status" aria-live="polite">
        2컷 또는 4컷을 선택해 주세요.
      </p>
    </section>

    <section id="capture-screen" class="photo-card workflow-screen hidden" aria-labelledby="capture-heading">
      <div id="capture-heading-row" class="card-heading">
        <div id="capture-title-group">
          <p id="capture-step" class="step-label">STEP 02</p>
          <h2 id="capture-heading">촬영할 준비를 해 주세요</h2>
        </div>
        <span id="selected-count" class="step-badge">4컷 촬영</span>
      </div>

      <div id="capture-progress" class="capture-progress" role="status" aria-live="polite">
        <span id="progress-label">진행</span>
        <strong id="progress-count">0 / 4</strong>
      </div>

      <div id="camera-stage" class="camera-stage">
        <video id="camera-video" class="camera-preview hidden" autoplay muted playsinline aria-label="촬영 중인 카메라 화면"></video>
        <div id="countdown" class="countdown hidden" aria-live="polite"></div>
        <div id="camera-placeholder" class="camera-placeholder">
          <span id="placeholder-icon" class="placeholder-icon" aria-hidden="true">✦</span>
          <p id="placeholder-copy">시작 버튼을 누르면<br id="placeholder-line-break">카메라가 켜져요.</p>
        </div>
      </div>

      <div id="preview-heading-row" class="preview-heading-row">
        <h3 id="preview-heading">찍은 사진</h3>
        <span id="preview-count">0장</span>
      </div>
      <div id="shot-previews" class="shot-previews" aria-label="찍은 사진 미리보기"></div>

      <p id="camera-status" class="status-message" role="status" aria-live="polite">
        시작 버튼을 누르면 선택한 수만큼 자동으로 촬영합니다.
      </p>

      <div id="capture-actions" class="capture-actions">
        <button id="back-to-selection-button" class="secondary-button" type="button">컷 수 다시 고르기</button>
        <button id="start-capture-button" class="capture-button" type="button">촬영 시작</button>
      </div>
    </section>

    <section id="result-screen" class="photo-card workflow-screen hidden" aria-labelledby="result-heading">
      <div id="result-heading-row" class="card-heading">
        <div id="result-title-group">
          <p id="result-step" class="step-label">STEP 03</p>
          <h2 id="result-heading">오늘의 사진이 완성됐어요</h2>
        </div>
      </div>

      <p id="filter-instruction" class="filter-instruction">필터를 골라 보세요</p>
      <div id="filters" class="filters" aria-label="사진 필터 선택"></div>

      <div id="final-frame-wrap" class="final-frame-wrap">
        <canvas id="final-frame" aria-label="오늘 촬영한 세로 사진 프레임"></canvas>
      </div>

      <p id="result-status" class="status-message" role="status" aria-live="polite">
        사진을 확인해 주세요.
      </p>
      <button id="restart-button" class="capture-button" type="button">처음으로</button>
    </section>

    <footer id="page-footer" class="page-footer">
      촬영한 사진은 이 브라우저 화면에서만 사용됩니다.
    </footer>
  </main>
</body>
</html>
